<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snow Dodge</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    max-width: 100vw;
    max-height: 100vh;
  }
</style>
</head>
<body>
<canvas id="game" width="800" height="600"></canvas>
<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const WIDTH = 800, HEIGHT = 600;
const PLAYER_WIDTH = 30, PLAYER_HEIGHT = 50;
const PLAYER_VELOCITY = 5;        // per frame at 60fps, same as the pygame version
const SNOW_WIDTH = 25, SNOW_HEIGHT = 25;
const SNOW_VELOCITY = 5;

let player, snows, startTime, elapsed, snowAddIncrement, snowCount, hit, quit, finalTime;
const keys = {};
let touchDir = 0;

function reset() {
  player = { x: 200, y: HEIGHT - PLAYER_HEIGHT, w: PLAYER_WIDTH, h: PLAYER_HEIGHT };
  snows = [];
  startTime = performance.now();
  elapsed = 0;
  snowAddIncrement = 2000;   // first flakes after 2s, then faster and faster
  snowCount = 0;
  hit = false;
  quit = false;
}
reset();

document.addEventListener("keydown", e => {
  keys[e.key] = true;
  if (e.key === "ArrowLeft" || e.key === "ArrowRight") e.preventDefault();
  if (hit || quit) {
    if (e.key === "r" || e.key === "R") reset();
    else if (e.key === "q" || e.key === "Q") quit = true;
  }
});
document.addEventListener("keyup", e => { keys[e.key] = false; });

// touch controls: hold left/right half to move; tap to restart on game over
canvas.addEventListener("touchstart", e => {
  e.preventDefault();
  if (hit || quit) { reset(); return; }
  const rect = canvas.getBoundingClientRect();
  const x = (e.touches[0].clientX - rect.left) / rect.width;
  touchDir = x < 0.5 ? -1 : 1;
}, { passive: false });
canvas.addEventListener("touchend", e => { e.preventDefault(); touchDir = 0; }, { passive: false });

// Pre-render the snowy background once (stands in for snowimage.jpg)
const BG = document.createElement("canvas");
BG.width = WIDTH; BG.height = HEIGHT;
(function paintBackground() {
  const b = BG.getContext("2d");
  // winter sky
  const sky = b.createLinearGradient(0, 0, 0, HEIGHT * 0.75);
  sky.addColorStop(0, "#a7c6e2");
  sky.addColorStop(1, "#dcebf7");
  b.fillStyle = sky;
  b.fillRect(0, 0, WIDTH, HEIGHT);
  // distant mountains
  b.fillStyle = "#c3d8ea";
  b.beginPath();
  b.moveTo(0, 340); b.lineTo(140, 210); b.lineTo(290, 340);
  b.lineTo(430, 230); b.lineTo(600, 350); b.lineTo(720, 260); b.lineTo(800, 340);
  b.lineTo(800, 400); b.lineTo(0, 400); b.fill();
  // snow ground
  const ground = b.createLinearGradient(0, HEIGHT * 0.6, 0, HEIGHT);
  ground.addColorStop(0, "#f4f9fd");
  ground.addColorStop(1, "#e2edf6");
  b.fillStyle = ground;
  b.beginPath();
  b.moveTo(0, 380);
  b.quadraticCurveTo(200, 350, 400, 375);
  b.quadraticCurveTo(620, 400, 800, 370);
  b.lineTo(800, HEIGHT); b.lineTo(0, HEIGHT); b.fill();
  // pine trees
  function tree(x, y, s) {
    b.fillStyle = "#3f6b4f";
    for (let i = 0; i < 3; i++) {
      const w = s * (1 - i * 0.22), h = s * 0.8, ty = y - i * s * 0.55;
      b.beginPath();
      b.moveTo(x, ty - h); b.lineTo(x - w / 2, ty); b.lineTo(x + w / 2, ty); b.fill();
    }
    // snow caps
    b.fillStyle = "rgba(255,255,255,0.75)";
    for (let i = 0; i < 3; i++) {
      const w = s * (1 - i * 0.22), h = s * 0.8, ty = y - i * s * 0.55;
      b.beginPath();
      b.moveTo(x, ty - h); b.lineTo(x - w / 5, ty - h + h / 3); b.lineTo(x + w / 5, ty - h + h / 3); b.fill();
    }
    b.fillStyle = "#5b4632";
    b.fillRect(x - s * 0.06, y, s * 0.12, s * 0.3);
  }
  tree(90, 430, 60); tree(680, 415, 50); tree(740, 460, 70); tree(170, 400, 38);
  // settled snow speckles
  b.fillStyle = "rgba(255,255,255,0.8)";
  for (let i = 0; i < 90; i++) {
    b.beginPath();
    b.arc(Math.random() * WIDTH, 380 + Math.random() * 220, 1 + Math.random() * 1.5, 0, Math.PI * 2);
    b.fill();
  }
})();

// Pre-render the snowflake sprite once (stands in for snowflake.snowglobe.PNG)
const FLAKE = document.createElement("canvas");
FLAKE.width = SNOW_WIDTH; FLAKE.height = SNOW_HEIGHT;
(function paintFlake() {
  const f = FLAKE.getContext("2d");
  const c = SNOW_WIDTH / 2;
  f.strokeStyle = "#9fd0f5";
  f.lineWidth = 2;
  f.lineCap = "round";
  for (let i = 0; i < 6; i++) {
    const a = (Math.PI / 3) * i;
    const dx = Math.cos(a), dy = Math.sin(a);
    f.beginPath();
    f.moveTo(c, c);
    f.lineTo(c + dx * (c - 1), c + dy * (c - 1));
    f.stroke();
    // side branches
    const bx = c + dx * (c * 0.6), by = c + dy * (c * 0.6);
    const a1 = a + Math.PI / 5, a2 = a - Math.PI / 5;
    f.beginPath();
    f.moveTo(bx, by);
    f.lineTo(bx + Math.cos(a1) * 4, by + Math.sin(a1) * 4);
    f.moveTo(bx, by);
    f.lineTo(bx + Math.cos(a2) * 4, by + Math.sin(a2) * 4);
    f.stroke();
  }
  f.fillStyle = "#ffffff";
  f.beginPath();
  f.arc(c, c, 2, 0, Math.PI * 2);
  f.fill();
})();

function collide(s) {
  return s.y + SNOW_HEIGHT >= player.y &&
         s.x < player.x + player.w && s.x + SNOW_WIDTH > player.x &&
         s.y < player.y + player.h && s.y + SNOW_HEIGHT > player.y;
}

let lastTick = performance.now();
function loop(now) {
  const dt = now - lastTick;
  lastTick = now;

  if (quit) {
    ctx.drawImage(BG, 0, 0);
    ctx.fillStyle = "red";
    ctx.font = "italic 32px 'Times New Roman'";
    ctx.textAlign = "center";
    ctx.fillText("Thanks for playing, snowy!", WIDTH / 2, HEIGHT / 2);
    ctx.fillStyle = "#308EC5";
    ctx.fillText("Press R to play again", WIDTH / 2, HEIGHT / 2 + 50);
    ctx.textAlign = "left";
    requestAnimationFrame(loop);
    return;
  }

  if (!hit) {
    elapsed = (now - startTime) / 1000;
    snowCount += dt;

    if (snowCount >= snowAddIncrement) {
      for (let i = 0; i < 3; i++) {
        const snowx = Math.floor(Math.random() * (WIDTH - SNOW_WIDTH));
        snows.push({ x: snowx, y: -SNOW_HEIGHT });
        snowAddIncrement = Math.max(200, snowAddIncrement - 50);
      }
      snowCount = 0;
    }

    const left = keys["ArrowLeft"] || touchDir === -1;
    const right = keys["ArrowRight"] || touchDir === 1;
    if (left && player.x - PLAYER_VELOCITY >= 0) player.x -= PLAYER_VELOCITY;
    if (right && player.x + PLAYER_VELOCITY + player.w <= WIDTH) player.x += PLAYER_VELOCITY;

    for (let i = snows.length - 1; i >= 0; i--) {
      snows[i].y += SNOW_VELOCITY;
      if (snows[i].y > HEIGHT) snows.splice(i, 1);
      else if (collide(snows[i])) { hit = true; finalTime = Math.round(elapsed); break; }
    }
  }

  ctx.drawImage(BG, 0, 0);

  // player (snowy)
  ctx.fillStyle = "#7EB7D8";
  ctx.fillRect(player.x, player.y, player.w, player.h);

  for (const s of snows) ctx.drawImage(FLAKE, s.x, s.y);

  ctx.fillStyle = "black";
  ctx.font = "italic 32px 'Times New Roman'";
  ctx.fillText("Time:" + Math.round(elapsed) + "s", 10, 40);

  if (hit) {
    ctx.textAlign = "center";
    ctx.fillStyle = "white";
    ctx.fillText("YOUR TIME:" + finalTime + "s", WIDTH / 2, 200);
    ctx.fillStyle = "red";
    ctx.fillText("YOU LOST SNOWY!", WIDTH / 2, HEIGHT / 2);
    ctx.fillStyle = "#308EC5";
    ctx.fillText("Press R to play again,snowy", WIDTH / 2, HEIGHT / 2 + 50);
    ctx.fillStyle = "red";
    ctx.fillText("Press Q to quit", WIDTH / 2, HEIGHT / 2 + 100);
    ctx.textAlign = "left";
  }

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
